name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: "Republicar a mesma versão (apaga tag/release existente)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm biome lint --diagnostic-level=error --no-errors-on-unmatched

      - name: Format check
        run: pnpm biome check --formatter-enabled=true --linter-enabled=false

      - name: Type check
        run: pnpm run type-check

      - name: Tests
        run: pnpm test:ci

  release:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets de assinatura
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY nos secrets do repositório."
            exit 1
          fi

      - name: Republicar versão existente (opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.republish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release delete "$TAG" -y 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Praise v__VERSION__"
          releaseBody: |
            ## Praise v__VERSION__

            ### Correções
            - Correção das imagens de fundo personalizadas (preview e projeção)
            - Imagens copiadas para a pasta de dados do app
            - Atualização automática ao abrir o aplicativo

            ### Como atualizar
            O app verifica atualizações automaticamente ao iniciar.
            Também é possível ir em **Configurações → Sistema → Verificar Agora**.
          releaseDraft: false
          prerelease: false
