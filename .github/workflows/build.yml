name: Build Praise

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: praise-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: praise-app/src-tauri

      - name: Install frontend dependencies
        working-directory: praise-app
        run: npm ci

      - name: Build Tauri (Windows)
        working-directory: praise-app
        run: npm run tauri build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Praise-Windows-Installer
          path: praise-app/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: Praise-Windows-Portable
          path: praise-app/src-tauri/target/release/praise-app.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: praise-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: praise-app/src-tauri

      - name: Install frontend dependencies
        working-directory: praise-app
        run: npm ci

      - name: Build Tauri (Linux)
        working-directory: praise-app
        run: npm run tauri build

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Praise-Linux-AppImage
          path: praise-app/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: Praise-Linux-DEB
          path: praise-app/src-tauri/target/release/bundle/deb/*.deb
